name: Platform source adoption
description: Propose a platform version or source change
body:
  - type: input
    id: target
    attributes:
      label: Target version or source
      placeholder: stable tag:vX.Y.Z, alpha branch:main, or alpha commit:SHA
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why this change?
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Supporting links (optional)
      description: Link the release or related work. Compatibility and rollout evidence belongs in adoption review.
