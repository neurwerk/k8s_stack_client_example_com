name: Platform source adoption
description: Propose a reviewed stable or alpha platform source transition.
title: "[Platform source]: "
body:
  - type: markdown
    attributes:
      value: Stable adoption requires signed release evidence. Alpha adoption requires reviewed Base main ancestry and separate HEAD trust. Channel selection is independent of environment. Opening this issue does not authorize deployment.
  - type: input
    id: current-version
    attributes:
      label: Current channel and selector
      placeholder: stable tag:vX.Y.Z, alpha branch:main, or alpha commit:SHA
    validations:
      required: true
  - type: input
    id: target-version
    attributes:
      label: Target channel and selector
      placeholder: stable tag:vX.Y.Z, alpha branch:main, or alpha commit:SHA
    validations:
      required: true
  - type: dropdown
    id: target-state
    attributes:
      label: Target state
      options:
        - Existing installation with retained state
        - Operator-attested empty target eligible for fresh installation
        - Unknown - adoption must remain blocked
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Source and compatibility evidence
      description: Summarize signed release checks or Base main ancestry, plus any alpha promotion SHA, migration actions, prerequisites, and recovery classification.
    validations:
      required: true
  - type: textarea
    id: rollout
    attributes:
      label: Pre/post checks and staged rollout
      description: Include client-value ordering and non-secret checks. Do not include deployment credentials or claim that this issue authorizes reconciliation.
    validations:
      required: true
  - type: checkboxes
    id: gates
    attributes:
      label: Adoption gates
      options:
        - label: The target uses the canonical stable or alpha source shape.
          required: true
        - label: I reviewed stateful, CRD, API, secret-reference, and resource-identity effects.
          required: true
        - label: "Maintainer review covers the exact source transition; merging that reviewed commit is the adoption authorization."
          required: true
        - label: "Stable transitions satisfy release compatibility; alpha transitions satisfy protected Base main ancestry; a moving alpha source is frozen and reconciled before promotion records the exact frozen SHA."
          required: true
