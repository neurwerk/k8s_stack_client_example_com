name: Platform Compatibility Controller

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  evaluate:
    name: Evaluate trusted platform compatibility
    uses: ./.github/workflows/platform-compatibility-evaluate.yaml
    with:
      pull_request_number: ${{ github.event.pull_request.number }}
      status_app_client_id: ${{ vars.PLATFORM_STATUS_APP_CLIENT_ID }}
    secrets: inherit
