name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  KUSTOMIZE_VERSION: v5.8.1
  KUBECONFORM_VERSION: 0.8.0

jobs:
  validate:
    name: Required CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: .tool-versions
          python-version: "3.12"
          enable-cache: true

      - name: Install Python
        run: uv python install "$UV_PYTHON"

      - name: Verify Python lockfile
        run: uv lock --check

      - name: Install kustomize
        uses: supplypike/setup-bin@8e3f88b4f143d9b5c3497f0fc12d45c83c123787 # v4.0.1
        with:
          uri: https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${{ env.KUSTOMIZE_VERSION }}/kustomize_${{ env.KUSTOMIZE_VERSION }}_linux_amd64.tar.gz
          name: kustomize
          version: ${{ env.KUSTOMIZE_VERSION }}

      - name: Install kubeconform
        uses: supplypike/setup-bin@8e3f88b4f143d9b5c3497f0fc12d45c83c123787 # v4.0.1
        with:
          uri: https://github.com/yannh/kubeconform/releases/download/v${{ env.KUBECONFORM_VERSION }}/kubeconform-linux-amd64.tar.gz
          name: kubeconform
          version: ${{ env.KUBECONFORM_VERSION }}

      - name: Identify Python for the pre-commit cache
        id: pre-commit-python
        run: |
          hash="$(uv run --no-project python -VV | sha256sum | cut -d' ' -f1)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Cache pre-commit hook environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ runner.os }}|${{ steps.pre-commit-python.outputs.hash }}|${{ hashFiles('.pre-commit-config.yaml', '.tool-versions') }}

      - name: Run lightweight pre-commit checks
        run: |
          version="$(awk '$1 == "pre-commit" { print $2 }' .tool-versions)"
          uv tool run --from "pre-commit==$version" pre-commit run --show-diff-on-failure --color=always --all-files

      - name: Run full validation once
        run: make check

      - name: Install reviewed composition validator
        run: |
          # Use actual published SDK artifacts and hash-locked dependencies.
          test -s config/tooling-requirements.txt || {
            echo 'Published Tooling dependency lock is required for composition CI.' >&2
            exit 1
          }
          uv venv --python "$UV_PYTHON" .ci/tooling
          uv pip sync --python .ci/tooling/bin/python --require-hashes config/tooling-requirements.txt

      - name: Acquire every selected source
        run: make addons-acquire TOOLING_PYTHON=.ci/tooling/bin/python

      - name: Validate complete installable composition
        run: make addons-check TOOLING_PYTHON=.ci/tooling/bin/python

      - name: Verify staged selection projection
        run: make addons-projection-check TOOLING_PYTHON=.ci/tooling/bin/python
