apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: client-app-values, namespace: flux-system}
spec:
  interval: 10m
  path: ./apps
  timeout: 5m
  wait: true
  prune: true
  dependsOn: [{name: namespaces}, {name: librechat-namespaces}]
  sourceRef: {kind: GitRepository, name: flux-system, namespace: flux-system}
---
