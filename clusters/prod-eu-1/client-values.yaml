apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: client-contextforge-values, namespace: flux-system}
spec:
  interval: 10m
  path: ./apps/contextforge
  timeout: 10m
  wait: false # Apply values before waiting for certificate approval and trust readiness.
  healthChecks:
    - {apiVersion: policy.cert-manager.io/v1alpha1, kind: CertificateRequestPolicy, name: cert-manager-internal-contextforge-server}
    - {apiVersion: cert-manager.io/v1, kind: ClusterIssuer, name: infra-cert-manager-internal-ca-issuer}
    - {apiVersion: v1, kind: ConfigMap, name: infra-openbao-ca-bundle, namespace: contextforge}
    - {apiVersion: v1, kind: ConfigMap, name: infra-openbao-ca-bundle, namespace: infra-postgres-operations}
  healthCheckExprs:
    - apiVersion: policy.cert-manager.io/v1alpha1
      kind: CertificateRequestPolicy
      current: 'has(status.conditions) && status.conditions.exists(c, c.type == "Ready" && c.observedGeneration == metadata.generation && c.status == "True")'
    - apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      current: 'has(status.conditions) && status.conditions.exists(c, c.type == "Ready" && c.observedGeneration == metadata.generation && c.status == "True")'
    - apiVersion: v1
      kind: ConfigMap
      current: '"ca.crt" in data && data["ca.crt"].size() > 0'
  prune: true
  dependsOn: [{name: contextforge-namespaces}, {name: namespaces}, {name: client-infrastructure-values}]
  sourceRef: {kind: GitRepository, name: flux-system, namespace: flux-system}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
