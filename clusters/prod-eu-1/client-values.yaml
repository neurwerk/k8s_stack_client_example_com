---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: client-docling-values, namespace: flux-system}
spec:
  interval: 10m
  path: ./apps/docling
  timeout: 5m
  wait: false # The exact optional approval policy must be ready before certificate issuance.
  healthChecks:
    - {apiVersion: policy.cert-manager.io/v1alpha1, kind: CertificateRequestPolicy, name: cert-manager-internal-docling-server}
  healthCheckExprs:
    - apiVersion: policy.cert-manager.io/v1alpha1
      kind: CertificateRequestPolicy
      current: 'has(status.conditions) && status.conditions.exists(c, c.type == "Ready" && c.observedGeneration == metadata.generation && c.status == "True")'
  prune: true
  dependsOn: [{name: docling-namespaces}]
  sourceRef: {kind: GitRepository, name: flux-system, namespace: flux-system}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: client-agentgateway-inspection-pki-values, namespace: flux-system}
spec:
  interval: 10m
  path: ./apps/agentgateway/inspection-pki
  timeout: 10m
  wait: false # Gate issuance on both current-generation approval policies.
  healthChecks:
    - {apiVersion: policy.cert-manager.io/v1alpha1, kind: CertificateRequestPolicy, name: cert-manager-agentgateway-inspection-root-2026-10}
    - {apiVersion: policy.cert-manager.io/v1alpha1, kind: CertificateRequestPolicy, name: cert-manager-agentgateway-inspection-signer-2026-10}
  healthCheckExprs:
    - apiVersion: policy.cert-manager.io/v1alpha1
      kind: CertificateRequestPolicy
      current: 'has(status.conditions) && status.conditions.exists(c, c.type == "Ready" && c.observedGeneration == metadata.generation && c.status == "True")'
  prune: true
  dependsOn: [{name: client-infrastructure-values}]
  sourceRef: {kind: GitRepository, name: flux-system, namespace: flux-system}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: client-agentgateway-inspection-trust-values, namespace: flux-system}
spec:
  interval: 10m
  path: ./apps/agentgateway/inspection-trust
  timeout: 5m
  wait: true
  prune: true
  dependsOn: [{name: agentgateway-inspection-pki}]
  sourceRef: {kind: GitRepository, name: flux-system, namespace: flux-system}
