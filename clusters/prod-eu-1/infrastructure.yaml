apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: agentgateway-inspection-pki, namespace: flux-system}
spec:
  interval: 10m
  path: ./releases/agentgateway/inspection-pki
  timeout: 20m
  wait: false
  healthChecks:
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: agentgateway-inspection-pki, namespace: infra-agentgateway}
    - {apiVersion: cert-manager.io/v1, kind: Certificate, name: agentgateway-inspection-root-2026-10-certificate, namespace: infra-cert-manager}
    - {apiVersion: cert-manager.io/v1, kind: Certificate, name: agentgateway-inspection-signer-2026-10-certificate, namespace: infra-agentgateway}
    - {apiVersion: trust.cert-manager.io/v1alpha1, kind: Bundle, name: agentgateway-inspection-root-2026-10-config-map}
    - {apiVersion: v1, kind: ConfigMap, name: agentgateway-inspection-root-2026-10-config-map, namespace: infra-cert-manager}
  healthCheckExprs:
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      current: 'has(status.conditions) && status.conditions.exists(c, c.type == "Ready" && c.observedGeneration == metadata.generation && c.status == "True")'
    - apiVersion: trust.cert-manager.io/v1alpha1
      kind: Bundle
      current: 'has(status.conditions) && status.conditions.exists(c, c.type == "Synced" && c.observedGeneration == metadata.generation && c.status == "True")'
    - apiVersion: v1
      kind: ConfigMap
      current: '"ca.crt" in data && data["ca.crt"].size() > 0'
  prune: true
  dependsOn: [{name: infrastructure}, {name: client-agentgateway-inspection-pki-values}]
  sourceRef: {kind: GitRepository, name: k8s-stack, namespace: flux-system}
---
