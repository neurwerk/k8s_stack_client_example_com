apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: external-secrets-controller, namespace: flux-system}
spec:
  interval: 10m
  path: ./releases/external-secrets
  timeout: 15m
  wait: true
  prune: true
  dependsOn: [{name: namespaces}]
  sourceRef: {kind: GitRepository, name: k8s-stack, namespace: flux-system}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: infrastructure, namespace: flux-system}
spec:
  interval: 1h
  path: ./releases/infrastructure
  patches:
    - target: {group: helm.toolkit.fluxcd.io, kind: HelmRelease, name: postgres-operations, namespace: infra-postgres-operations}
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata: {name: postgres-operations, namespace: infra-postgres-operations}
        spec:
          values:
            postgresOperations:
              service: {postgresqlPort: 5432, documentdbPort: 10260}
              containerPorts: {postgresql: 9712, documentdb: 10260}
    # The early controller and dedicated ContextForge stages own these resources.
    - target: {kind: HelmRelease, name: external-secrets, namespace: infra-external-secrets}
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata: {name: external-secrets, namespace: infra-external-secrets}
        $patch: delete
    - target: {kind: HelmRelease, name: contextforge-certificates, namespace: contextforge}
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata: {name: contextforge-certificates, namespace: contextforge}
        $patch: delete
    - target: {kind: HelmRelease, name: contextforge-postgres, namespace: infra-postgres-operations}
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata: {name: contextforge-postgres, namespace: infra-postgres-operations}
        $patch: delete
    - target: {kind: NetworkPolicy, name: contextforge-postgres, namespace: infra-postgres-operations}
      patch: |
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata: {name: contextforge-postgres, namespace: infra-postgres-operations}
        $patch: delete
  timeout: 60m
  wait: true
  healthCheckExprs:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      current: 'has(status.conditions) && status.conditions.exists(c, c.type == "Programmed" && c.observedGeneration == metadata.generation && c.status == "True") && has(status.listeners) && status.listeners.size() == spec.listeners.size() && status.listeners.all(l, l.conditions.exists(c, c.type == "ResolvedRefs" && c.observedGeneration == metadata.generation && c.status == "True"))'
  prune: true
  dependsOn: [{name: namespaces}, {name: librechat-namespaces}, {name: pipecat-namespaces}, {name: client-infrastructure-values}, {name: docling-reloader-values}, {name: external-secrets-controller}]
  sourceRef: {kind: GitRepository, name: k8s-stack, namespace: flux-system}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: pipecat-secret-sync, namespace: flux-system}
spec:
  interval: 10m
  path: ./releases/pipecat/secret-sync
  timeout: 10m
  wait: false # Bootstrap storage and delivery without waiting for operator credentials.
  healthCheckExprs:
    - apiVersion: objectbucket.io/v1alpha1
      kind: ObjectBucketClaim
      current: 'has(status.phase) && status.phase == "Bound"'
  healthChecks:
    - {apiVersion: v1, kind: ServiceAccount, namespace: pipecat, name: pipecat-external-secrets}
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, namespace: pipecat, name: pipecat-shared}
    - {apiVersion: objectbucket.io/v1alpha1, kind: ObjectBucketClaim, namespace: pipecat, name: pipecat-scripts}
    - {apiVersion: v1, kind: Secret, namespace: pipecat, name: rook-ceph-object-user-infra-rook-ceph-object-store-pipecat-script-publisher}
    - {apiVersion: v1, kind: Secret, namespace: pipecat, name: rook-ceph-object-user-infra-rook-ceph-object-store-pipecat-script-reader}
  prune: true
  dependsOn: [{name: pipecat-namespaces}, {name: external-secrets-controller}, {name: client-pipecat-values}, {name: client-app-values}, {name: client-infrastructure-values}, {name: infrastructure}]
  sourceRef: {kind: GitRepository, name: pipecat-addon, namespace: flux-system}
---
