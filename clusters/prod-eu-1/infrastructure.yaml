apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: tailscale-operator, namespace: flux-system}
spec:
  interval: 10m
  path: ./releases/tailscale/operator
  timeout: 5m
  wait: false
  healthChecks:
    - {apiVersion: external-secrets.io/v1, kind: ExternalSecret, name: operator-oauth, namespace: tailscale}
    - {apiVersion: v1, kind: Secret, name: operator-oauth, namespace: tailscale}
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: tailscale-operator, namespace: tailscale}
    - {apiVersion: apps/v1, kind: Deployment, name: operator, namespace: tailscale}
  patches:
    - target: {group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease, name: tailscale-operator}
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata: {name: tailscale-operator, namespace: tailscale}
        spec:
          suspend: false
          postRenderers:
            - kustomize:
                patches:
                  - target: {group: apps, version: v1, kind: Deployment, name: operator}
                    patch: |-
                      apiVersion: apps/v1
                      kind: Deployment
                      metadata: {name: operator}
                      spec:
                        template:
                          spec:
                            volumes:
                              - name: operator-home
                                emptyDir: {}
                            containers:
                              - name: operator
                                env: [{name: HOME, value: /home/operator}]
                                volumeMounts: [{name: operator-home, mountPath: /home/operator}]
  prune: true
  dependsOn: [{name: tailscale-namespaces}, {name: client-tailscale-values}, {name: tailscale-secret-sync}]
  sourceRef: {kind: GitRepository, name: k8s-stack, namespace: flux-system}
---
