  path: ./releases/dify/certificate-approval
  timeout: 20m
  wait: true
  prune: true
  dependsOn: [{name: dify-namespaces}, {name: infrastructure}, {name: client-infrastructure-values}]
  sourceRef: {kind: GitRepository, name: dify-addon, namespace: flux-system}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: docling-secret-sync, namespace: flux-system}
spec:
  interval: 10m
  path: ./releases/docling/secret-sync/internal
  timeout: 5m
  wait: false
  healthChecks:
    - {apiVersion: external-secrets.io/v1, kind: SecretStore, name: docling-openbao-secret-store, namespace: docling}
    - {apiVersion: external-secrets.io/v1, kind: SecretStore, name: monitor-agentgateway-extproc-openbao-secret-store, namespace: monitor-agentgateway-extproc}
    - {apiVersion: external-secrets.io/v1, kind: ExternalSecret, name: docling-api, namespace: docling}
    - {apiVersion: external-secrets.io/v1, kind: ExternalSecret, name: monitor-agentgateway-extproc-docling-secret, namespace: monitor-agentgateway-extproc}
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: SecretStore
      current: 'has(status.conditions) && status.conditions.exists(c, c.type == "Ready" && c.status == "True")'
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      current: 'has(status.conditions) && status.conditions.exists(c, c.type == "Ready" && c.status == "True") && has(status.syncedResourceVersion) && status.syncedResourceVersion.startsWith(string(metadata.generation) + "-")'
  prune: true
  dependsOn: [{name: docling-namespaces}, {name: client-docling-values}, {name: infrastructure}, {name: namespaces}]
  sourceRef: {kind: GitRepository, name: k8s-stack, namespace: flux-system}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: docling-reloader-values, namespace: flux-system}
spec:
  interval: 10m
  path: ./releases/docling/reloader
  timeout: 5m
  wait: true
  prune: true
  dependsOn: [{name: namespaces}, {name: docling-namespaces}]
  sourceRef: {kind: GitRepository, name: k8s-stack, namespace: flux-system}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: glitchtip-namespaces, namespace: flux-system}
spec:
  interval: 10m
  path: ./releases/namespaces/glitchtip
  timeout: 5m
  wait: true
  prune: true
  sourceRef: {kind: GitRepository, name: k8s-stack, namespace: flux-system}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: client-glitchtip-values, namespace: flux-system}
spec:
  interval: 10m
  path: ./apps/glitchtip
  timeout: 5m
  wait: true
  prune: true
  dependsOn: [{name: glitchtip-namespaces}]
  sourceRef: {kind: GitRepository, name: flux-system, namespace: flux-system}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: glitchtip-secret-sync, namespace: flux-system}
spec:
  interval: 10m
  path: ./releases/glitchtip/secret-sync
  timeout: 5m
  wait: false
  prune: true
  # The operations database consumes these credentials; do not wait for infrastructure Ready.
  dependsOn: [{name: client-glitchtip-values}, {name: client-infrastructure-values}, {name: external-secrets-controller}]
  healthChecks:
    - {apiVersion: external-secrets.io/v1, kind: SecretStore, name: glitchtip-openbao-secret-store, namespace: glitchtip}
    - {apiVersion: external-secrets.io/v1, kind: ExternalSecret, name: glitchtip-runtime, namespace: glitchtip}
    - {apiVersion: external-secrets.io/v1, kind: ExternalSecret, name: glitchtip-postgres-values, namespace: infra-postgres-operations}
    - {apiVersion: v1, kind: Secret, name: glitchtip-runtime, namespace: glitchtip}
    - {apiVersion: v1, kind: Secret, name: glitchtip-postgres-values, namespace: infra-postgres-operations}
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: SecretStore
      current: 'has(status.conditions) && status.conditions.exists(c, c.type == "Ready" && c.status == "True")'
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      current: 'has(status.conditions) && status.conditions.exists(c, c.type == "Ready" && c.status == "True") && has(status.syncedResourceVersion) && status.syncedResourceVersion.startsWith(string(metadata.generation) + "-")'
  sourceRef: {kind: GitRepository, name: k8s-stack, namespace: flux-system}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: glitchtip-initial-owner, namespace: flux-system}
spec:
  interval: 10m
  path: ./releases/glitchtip/secret-sync/initial-owner
  timeout: 5m
  wait: false
  prune: true
  dependsOn: [{name: client-glitchtip-values}, {name: external-secrets-controller}]
  healthChecks:
    - {apiVersion: external-secrets.io/v1, kind: ExternalSecret, name: glitchtip-owner, namespace: glitchtip}
    - {apiVersion: v1, kind: Secret, name: glitchtip-owner, namespace: glitchtip}
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      current: 'has(status.conditions) && status.conditions.exists(c, c.type == "Ready" && c.status == "True") && has(status.syncedResourceVersion) && status.syncedResourceVersion.startsWith(string(metadata.generation) + "-")'
  sourceRef: {kind: GitRepository, name: k8s-stack, namespace: flux-system}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: glitchtip-postgres, namespace: flux-system}
spec:
  interval: 10m
  path: ./releases/glitchtip/postgres
  timeout: 15m
  wait: true
  prune: true
  dependsOn: [{name: glitchtip-secret-sync}, {name: infrastructure}]
  sourceRef: {kind: GitRepository, name: k8s-stack, namespace: flux-system}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: glitchtip-tailscale-access, namespace: flux-system}
spec:
  interval: 10m
  path: ./releases/glitchtip/tailscale-access
  timeout: 5m
  wait: true
  prune: true
  dependsOn: [{name: glitchtip-namespaces}, {name: tailscale-operator}]
  sourceRef: {kind: GitRepository, name: k8s-stack, namespace: flux-system}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: glitchtip-app, namespace: flux-system}
spec:
  interval: 10m
  path: ./releases/glitchtip/app
  timeout: 30m
  wait: true
  prune: true
  dependsOn: [{name: client-glitchtip-values}, {name: glitchtip-secret-sync}, {name: glitchtip-initial-owner}, {name: glitchtip-postgres}, {name: glitchtip-tailscale-access}]
  # For first setup, provision with the adapter off, import its DSN, then enable it.
  sourceRef: {kind: GitRepository, name: k8s-stack, namespace: flux-system}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: glitchtip-adapter-access, namespace: flux-system}
spec:
  interval: 10m
  path: ./releases/glitchtip/adapter-access
  timeout: 5m
  wait: false
  prune: true
  dependsOn: [{name: glitchtip-app}]
  healthChecks:
    - {apiVersion: external-secrets.io/v1, kind: ExternalSecret, name: glitchtip-adapter, namespace: glitchtip}
    - {apiVersion: external-secrets.io/v1, kind: ExternalSecret, name: glitchtip-opensearch-reader, namespace: monitor-opensearch}
    - {apiVersion: v1, kind: Secret, name: glitchtip-adapter, namespace: glitchtip}
    - {apiVersion: v1, kind: Secret, name: glitchtip-opensearch-reader, namespace: monitor-opensearch}
    - {apiVersion: v1, kind: ConfigMap, name: glitchtip-opensearch-ca, namespace: glitchtip}
    - {apiVersion: trust.cert-manager.io/v1alpha1, kind: Bundle, name: glitchtip-opensearch-ca}
  healthCheckExprs:
    - apiVersion: v1
      kind: ConfigMap
      current: '"ca.crt" in data && data["ca.crt"].size() > 0'
    - apiVersion: trust.cert-manager.io/v1alpha1
      kind: Bundle
      current: 'has(status.conditions) && status.conditions.exists(c, c.type == "Synced" && c.status == "True" && c.observedGeneration == metadata.generation)'
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      current: 'has(status.conditions) && status.conditions.exists(c, c.type == "Ready" && c.status == "True") && has(status.syncedResourceVersion) && status.syncedResourceVersion.startsWith(string(metadata.generation) + "-")'
  sourceRef: {kind: GitRepository, name: k8s-stack, namespace: flux-system}
