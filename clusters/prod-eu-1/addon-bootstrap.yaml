apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-controller
  namespace: flux-system
spec:
  interval: 10m
  path: ./releases/external-secrets
  timeout: 15m
  prune: true
  wait: true
  dependsOn: [{name: namespaces}]
  sourceRef: {kind: GitRepository, name: k8s-stack, namespace: flux-system}
