apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: applications, namespace: flux-system}
spec:
  interval: 10m
  path: ./releases/applications
  # Dedicated ContextForge stages own these objects independently of Studio.
  patches:
    - target: {kind: ConfigMap, name: contextforge-(app-defaults|runtime), namespace: contextforge}
      patch: |
        apiVersion: v1
        kind: ConfigMap
        metadata: {name: contextforge}
        $patch: delete
    - target: {kind: HelmRelease, name: contextforge, namespace: contextforge}
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata: {name: contextforge, namespace: contextforge}
        $patch: delete
  timeout: 120m
  wait: false
  healthChecks:
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: keycloak, namespace: auth-keycloak}
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: keycloak-agentgateway-oidc, namespace: auth-keycloak}
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: keycloak-initial-admin, namespace: auth-keycloak}
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: keycloak-keycloak-api-key-bridge-oidc, namespace: auth-keycloak}
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: keycloak-realm-roles, namespace: auth-keycloak}
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: keycloak-studio-oidc, namespace: auth-keycloak}
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: keycloak-api-key-bridge, namespace: auth-keycloak-api-key-bridge}
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: studio, namespace: frontend-studio}
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: studio-api, namespace: frontend-studio}
    - {apiVersion: apps/v1, kind: Deployment, name: frontend-studio-api-deployment, namespace: frontend-studio}
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: agentgateway, namespace: infra-agentgateway}
    - {apiVersion: v1, kind: ConfigMap, name: gateway-model-metadata-config-map, namespace: frontend-studio}
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: agentgateway-extproc, namespace: monitor-agentgateway-extproc}
    - {apiVersion: helm.toolkit.fluxcd.io/v2, kind: HelmRelease, name: langfuse, namespace: monitor-langfuse}
    - {apiVersion: gateway.networking.k8s.io/v1, kind: Gateway, name: auth-keycloak-gateway, namespace: auth-keycloak}
    - {apiVersion: gateway.networking.k8s.io/v1, kind: Gateway, name: infra-agentgateway-external-gateway, namespace: infra-agentgateway}
    - {apiVersion: gateway.networking.k8s.io/v1, kind: Gateway, name: infra-agentgateway-gateway, namespace: infra-agentgateway}
    - {apiVersion: gateway.networking.k8s.io/v1, kind: Gateway, name: monitor-langfuse-gateway, namespace: monitor-langfuse}
    - {apiVersion: gateway.networking.k8s.io/v1, kind: Gateway, name: frontend-studio-gateway, namespace: frontend-studio}
  healthCheckExprs:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      current: 'has(status.conditions) && status.conditions.exists(c, c.type == "Ready" && c.observedGeneration == metadata.generation && c.status == "True")'
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      current: 'has(status.conditions) && status.conditions.exists(c, c.type == "Programmed" && c.observedGeneration == metadata.generation && c.status == "True") && has(status.listeners) && status.listeners.size() == spec.listeners.size() && status.listeners.all(l, l.conditions.exists(c, c.type == "ResolvedRefs" && c.observedGeneration == metadata.generation && c.status == "True"))'
  prune: true
  dependsOn: [{name: infrastructure}, {name: client-app-values}, {name: studio-secret-sync}, {name: keycloak-api-key-bridge-secret-sync}]
  sourceRef: {kind: GitRepository, name: k8s-stack, namespace: flux-system}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
