apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: frontend-dify
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: client-values
    files:
      - values.yaml=../../config/client.yaml
  - name: dify-product-values
    files:
      - values.yaml=values.yaml
