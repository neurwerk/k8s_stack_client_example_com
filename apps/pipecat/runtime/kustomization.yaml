apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pipecat
generatorOptions:
  disableNameSuffixHash: true
  labels: {reconcile.fluxcd.io/watch: Enabled}
configMapGenerator:
  - name: client-values
    files: [values.yaml=../../../config/client.yaml]
  - name: pipecat-product-values
    files: [values.yaml=../values.yaml]
