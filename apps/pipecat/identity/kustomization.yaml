apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auth-keycloak
generatorOptions:
  disableNameSuffixHash: true
  labels: {reconcile.fluxcd.io/watch: Enabled}
configMapGenerator:
  - name: pipecat-product-values
    files: [values.yaml=../values.yaml]
  - name: pipecat-oidc-approval-values
    files: [values.yaml=../oidc-approval/values.yaml]
