apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auth-keycloak
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: keycloak-branding-logo
    files: [company-logo.svg]
  - name: open-webui-oidc-approval-values
    files: [values.yaml=../open-webui/oidc-approval/values.yaml]
  - name: librechat-oidc-approval-values
    files: [values.yaml=../librechat/oidc-approval/values.yaml]
  - name: client-values
    files:
      - values.yaml=../../config/client.yaml
  - name: keycloak-product-values
    files:
      - values.yaml=values.yaml
  - name: client-openrouter-catalog-values
    files:
      - values.yaml=../../config/openrouter-catalog.yaml
