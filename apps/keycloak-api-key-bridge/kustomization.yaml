apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: auth-keycloak-api-key-bridge
generatorOptions:
  disableNameSuffixHash: true
  labels: {reconcile.fluxcd.io/watch: Enabled}
configMapGenerator:
  - name: keycloak-product-values
    files: [values.yaml=../keycloak/values.yaml]
  - name: client-values
    files:
      - values.yaml=../../config/client.yaml
  - name: keycloak-api-key-bridge-product-values
    files:
      - values.yaml=values.yaml
  - name: client-openrouter-catalog-values
    files:
      - values.yaml=../../config/openrouter-catalog.yaml
