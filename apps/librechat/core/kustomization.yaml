apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: frontend-librechat
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: client-values
    files:
      - values.yaml=../../../config/client.yaml
  - name: librechat-product-values
    files:
      - values.yaml=../values.yaml
  - name: librechat-agentgateway-model-values
    files:
      - values.yaml=../../../infrastructure/networking/agentgateway/values.yaml
