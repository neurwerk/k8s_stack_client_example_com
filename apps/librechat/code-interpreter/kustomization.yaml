apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: librechat-code-interpreter
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: client-values
    files:
      - values.yaml=../../../config/client.yaml
  - name: librechat-product-values
    files:
      - values.yaml=../values.yaml
