infraAgentgatewayWrapper:
  tracing:
    fields:
      add:
        langfuse.observation.metadata.conversation_id: 'default(request.headers["x-session-id"], null)' # Correlation only; identity comes from the verified token.
  llamacpp: # Legacy backend settings; keep aligned with the local binding in config/client.yaml.
    enabled: true # The binding's upstreamURL is authoritative for current gateway routes.
    host: ollama.inference.svc.cluster.local # Replace with your trusted inference Service or hostname.
    port: 11434 # Ollama's OpenAI-compatible HTTP port.
externalGateway:
  enabled: true # Route canonical public API URLs through Traefik.
aiGateway:
  proxy:
    tlsSecretName: agentgateway-proxy-tls-secrets # cert-manager owns this proxy-server certificate.
    signerSecretName: agentgateway-inspection-signer-2026-10-secrets # Match the selected inspection root ID.
    ingressPeers: # Only the edge proxy may connect to the inspected TLS listener.
      - namespaceSelector:
          matchLabels: {kubernetes.io/metadata.name: kube-system}
        podSelector:
          matchLabels: {app.kubernetes.io/name: traefik}
guardrails:
  llmPolicyEngine:
    models: # Explicit policies override matching entries from config/openrouter-catalog.yaml.
      - name: remote/openrouter/deepseek/deepseek-v4.1-flash-1017 # The single selected OpenRouter model.
        piiEnabled: true # Apply the configured PII policy.
        contentTracingEnabled: true # Record eligible content traces.
        provider: Openrouter # OpenRouter adapter name.
        model: deepseek/deepseek-v4.1-flash-1017 # Exact upstream model ID.
        label: DeepSeek V4.1 Flash 1017 # Display label.
        group: Remote-OpenRouter-DeepSeek # Display group.
        baseURL: https://openrouter.ai/api/v1 # Official provider API origin.
        authSecret: infra-agentgateway-secret # ESO-delivered provider key reference.
        supportsImages: true # Attachment policy extracts text instead of forwarding image bytes.
        attachments:
          documents: {mode: extract-text} # Extract document text with Docling.
          images: {mode: extract-text} # Extract image text with Docling.
      - name: remote/deepseek/v4.1-flash # Canonical ID used by bindings and authorization roles.
        piiEnabled: true # Apply the configured PII policy to remote requests.
        contentTracingEnabled: true # Record eligible content in Langfuse.
        provider: Deepseek # Direct-provider adapter name.
        model: deepseek-flash # Actual upstream model identifier.
        label: DeepSeek Flash V4.1 # Human-readable model label.
        group: Remote-Deepseek # Group shown in model selectors.
        baseURL: https://api.deepseek.com/v1 # Official direct-provider API origin.
        authSecret: infra-agentgateway-deepseek-secret # Reference to the separately delivered API key.
        supportsImages: true # Attachment handling below extracts text before forwarding.
        attachments:
          documents: {mode: extract-text} # Use Docling to extract document text.
          images: {mode: extract-text} # Use Docling to extract image text.
      - name: local/llama3.2-3b # Canonical ID of the one local model.
        piiEnabled: false # Trusted local fallback avoids recursive privacy reroutes.
        contentTracingEnabled: true # Record eligible local-model traces.
        model: llama3.2:3b # Model tag installed on your local inference server.
        local: true # Trusted local model; the binding in config/client.yaml selects its upstream.
