# Per-app configuration for infra-agentgateway
# Example/template showing all possible overrides.
# Copy this to a new client repo and adjust values.

# ── Local LLM (llama.cpp) ─────────────────────────────────────────────────────
# Enable for clients that have a local llama.cpp/Ollama server on their network.
# Required for local:true models and for piiReroute fallbacks.
infraAgentgatewayWrapper:
  llamacpp:
    enabled: true
    host: ollama.internal.example
    port: 11434

# ── ExtAuthz timeout ──────────────────────────────────────────────────────────
# Override the proxy-level timeout for external authorization subrequests
# (keycloak-api-key-bridge /validate).  Default: "1s".
# Increase if the bridge is slow (large clusters, far Keycloak instance):
#
#infraAgentgatewayWrapper:
#  extAuthz:
#    requestTimeout: "2s"
#  llamacpp:
#    enabled: true
#    host: ollama.internal.example
#    port: 11434

# ── Model-centric serving ─────────────────────────────────────────────────────
# Each entry is a model users can select (discoverable on /v1/models).
guardrails:
  llmPolicyEngine:
    localTarget:
      name: local/llama3.2-3b
      model: llama3.2:3b
    models:
      # OpenRouter leaderboard models, all rerouted locally on PII.
      - name: remote/openrouter/ox-alpha
        piiEnabled: true
        contentTracingEnabled: true
        provider: Openrouter
        model: stealth/ox-alpha
        baseURL: https://openrouter.ai/api/v1
        authSecret: infra-agentgateway-secret
        piiReroute: true
