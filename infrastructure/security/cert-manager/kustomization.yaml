apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infra-cert-manager
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: client-values
    files:
      - values.yaml=../../../config/client.yaml
  - name: cert-manager-product-values
    files:
      - values.yaml=values.yaml
