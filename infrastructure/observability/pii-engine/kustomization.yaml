apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitor-pii-engine
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: client-values
    files:
      - values.yaml=../../../config/client.yaml
  - name: pii-engine-product-values
    files:
      - values.yaml=values.yaml
